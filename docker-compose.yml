services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory
    volumes:
      - directory_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://directory:directory@db:5432/directory?schema=public
      APP_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  directory_pg:
